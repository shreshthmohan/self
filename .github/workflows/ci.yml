# Every push. Nothing here is optional and nothing is scheduled: a rule that
# runs by hand is a rule that has already rotted. See ADR 0002.
name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      # Chromium alone. The suite runs the flows twice in one engine, with
      # JavaScript and without; a second engine tests the browser, not the app.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test

      # The report carries the trace of anything that failed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/.tmp/report
          retention-days: 7
